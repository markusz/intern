[package]
name = "intern"
version = "0.5.0"
edition = "2024"
license = "MIT"
publish = false
description = "A rule-based linter for PowerPoint (.pptx) files"
repository = "https://github.com/markusz/intern"
homepage = "https://markusz.github.io/intern/"

[dependencies]
intern-core = { path = "../intern-core", version = "0.5.0" }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

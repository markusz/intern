name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest    # cross-compiled from M1; pure Rust, no C deps
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: fix cargo path (macOS)
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: build
        run: cargo build -p intern --release --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../intern-${{ matrix.target }}.tar.gz intern

      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/intern.exe `
            -DestinationPath intern-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: intern-${{ matrix.target }}
          path: intern-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: intern-*
          generate_release_notes: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: compute checksums
        id: sha
        run: |
          echo "aarch64=$(shasum -a 256 intern-aarch64-apple-darwin.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "x86_64_mac=$(shasum -a 256 intern-x86_64-apple-darwin.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux=$(shasum -a 256 intern-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: markusz/homebrew-intern
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-intern

      - name: update formula
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/version \".*\"/version \"$VERSION\"/" homebrew-intern/Formula/intern.rb
          sed -i "/aarch64-apple-darwin/{n;s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.aarch64 }}\"/}" homebrew-intern/Formula/intern.rb
          sed -i "/x86_64-apple-darwin/{n;s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.x86_64_mac }}\"/}" homebrew-intern/Formula/intern.rb
          sed -i "/x86_64-unknown-linux-gnu/{n;s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.linux }}\"/}" homebrew-intern/Formula/intern.rb

      - name: push formula
        run: |
          cd homebrew-intern
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/intern.rb
          git commit -m "Update intern to ${GITHUB_REF_NAME}"
          git push

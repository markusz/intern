[package]
name = "pptlint"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
ppt-rs = "0.2.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1"
toml = "1.1.2"
